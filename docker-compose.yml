services:
  backend:
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: ai_backend
    ports:
      - "8000:8000"
    networks:
      - ai_network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: ai_frontend
    ports:
      - "8501:8501"
    depends_on:
      - backend
    environment:
      API_URL: "http://backend:8000"
    networks:
      - ai_network

networks:
  ai_network:
    driver: bridge
